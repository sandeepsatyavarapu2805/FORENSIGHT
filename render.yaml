databases:
  - name: forensight-db
    databaseName: forensight
    user: forensight_app

services:
  - type: web
    name: forensight-api
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DATABASE_URL
        fromDatabase:
          name: forensight-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: AI_PROVIDER
        value: disabled
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: UPLOAD_STORAGE_PATH
        value: /var/data/forensight/uploads
    disk:
      name: forensight-evidence
      mountPath: /var/data/forensight
      sizeGB: 1

  - type: web
    name: forensight-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

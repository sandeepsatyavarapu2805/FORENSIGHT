[project]
name = "forensight-backend"
version = "0.1.0"
description = "Backend application for ForenSight AI"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi",
    "psycopg[binary]>=3.3.4",
    "pydantic",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]